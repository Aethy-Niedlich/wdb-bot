[package]
name = "wdb-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "wdb_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nalgebra = "0.33"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
