name: train

on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Rollout steps'
        default: '2000'
  schedule:
    - cron: '0 3 * * *'   # nightly short run

jobs:
  ppo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install maturin torch numpy pytest
      - run: maturin develop --manifest-path rust/Cargo.toml

      - name: Run PPO training (short)
        env:
          STEPS: ${{ github.event.inputs.steps || '2000' }}
        run: |
          python -m wdb.main --steps "$STEPS" \
            --checkpoint-dir checkpoints/

      - name: Upload latest checkpoint only (keeps quota small)
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-${{ github.run_id }}
          path: checkpoints/latest.pt
          retention-days: 3
