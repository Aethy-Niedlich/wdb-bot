name: train

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'   # nightly short run

jobs:
  ppo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies and build Rust
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin numpy pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Build and install the Rust extension directly via pip
          pip install ./python
          
      - name: Run PPO training
        run: |
          source .venv/bin/activate
          cd python
          python -m wdb.main

      - name: Upload latest checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-${{ github.run_id }}
          path: python/latest.pt
          retention-days: 3