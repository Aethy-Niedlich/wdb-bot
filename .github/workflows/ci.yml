name: ci

on:
  push:
  pull_request:

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/Cargo.toml -- --test-threads=1

  python-parity:
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      # Install Node.js for the JS physics engine
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Generate Reference Traces via JS
        run: node scripts/record_reference.js
        
      - name: Create Virtual Environment
        run: python -m venv .venv
        
      - name: Install Dependencies and Build Rust
        run: |
          source .venv/bin/activate
          pip install maturin pytest numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ./python
          
      - name: Run Parity Test
        run: |
          source .venv/bin/activate
          cd python
          pytest tests/test_parity.py -q